<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence — Mindful Life & Task Dashboard</title>
    <meta name="description" content="A polished, visually satisfying personal command center for Website, YouTube, House, Reading, and Workout." />
    <meta property="og:title" content="Cadence — Mindful Life & Task Dashboard" />
    <meta property="og:description" content="A polished, visually satisfying personal command center for Website, YouTube, House, Reading, and Workout." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cadence_life_dashboard_settings_v2');
          if (saved) {
            var settings = JSON.parse(saved);
            if (settings.theme === 'dark' || (settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.documentElement.classList.add('dark');
            } else if (settings.theme === 'light') {
              document.documentElement.classList.remove('dark');
            }
            if (settings.typography) {
              document.documentElement.setAttribute('data-typography', settings.typography);
            }
            if (settings.colorTheme) {
              document.documentElement.setAttribute('data-color-theme', settings.colorTheme);
            }
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] dark:bg-[#0C1724] text-[#1B3D5F] dark:text-slate-100 antialiased selection:bg-[#99BFF9]/30 selection:text-[#1B3D5F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
